name: Release BrightVault

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run Tests
        env:
          CGO_ENABLED: '0'
        run: go test ./internal/updater ./internal/vault ./internal/server

      - name: Build BrightVault.exe
        env:
          CGO_ENABLED: '0'
        run: go build -ldflags="-H=windowsgui" -o BrightVault.exe ./cmd/ytcloud

      - name: Package Release ZIP
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag -or $tag -eq "main") { $tag = "v0.7" }
          Compress-Archive -Path BrightVault.exe, README.md, LICENSE -DestinationPath "BrightVault-$tag-windows-amd64.zip" -Force

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            BrightVault.exe
            BrightVault-*-windows-amd64.zip
